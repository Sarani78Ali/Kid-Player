<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0e13">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kid Player">
<title>Kid Player</title>
<style>
:root{
  --bg:#171719;--top:#222224;--cover:#2b2b2d;--text:#f1f1f3;
  --muted:#a8a8af;--line:#57575c;--accent:#62c979;--active:#29342d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button,input{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.status-space{height:max(34px,env(safe-area-inset-top));background:var(--top)}
.topbar{height:64px;background:var(--top);display:flex;align-items:center;padding:0 18px;flex:none}
.icon-btn{width:48px;height:48px;border:0;background:transparent;color:#e8e8ea;border-radius:50%;
font-size:30px;display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:#353538}
.icon-btn.sm{width:38px;height:38px}
.line-icon{display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.heart-svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7}
.heart-svg.filled{fill:currentColor;stroke:none}
.solid-icon{display:block}
.solid-icon path{fill:currentColor}
.app-name{font-size:21px;font-weight:800;letter-spacing:.2px;color:#eeeeef}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{flex:none;border-radius:8px}
.spacer{flex:1}
.top-icons{display:flex;gap:3px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.cover-zone{height:34vh;min-height:230px;max-height:390px;background:var(--cover);
display:grid;place-items:center;position:relative;flex:none;touch-action:pan-y}
.cover{width:min(58vw,300px);aspect-ratio:1;border-radius:28px;
background:linear-gradient(145deg,#68686b,#47474a);display:grid;place-items:center;
box-shadow:0 16px 36px #0004}
.note-icon{width:min(30vw,138px);height:min(30vw,138px);fill:#242426;filter:drop-shadow(0 3px 0 #7773)}
.cover>*{grid-area:1/1}
.cover-art{width:100%;height:100%;object-fit:cover;border-radius:28px;display:none}
.cover-art.show{display:block}
.cover.has-art .note-icon{display:none}
@keyframes coverNext{
  0%{opacity:1;transform:translateX(0) scale(1)}
  45%{opacity:0;transform:translateX(-24px) scale(.94)}
  55%{opacity:0;transform:translateX(24px) scale(.94)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
@keyframes coverPrev{
  0%{opacity:1;transform:translateX(0) scale(1)}
  45%{opacity:0;transform:translateX(24px) scale(.94)}
  55%{opacity:0;transform:translateX(-24px) scale(.94)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
.cover.anim-next{animation:coverNext .38s ease}
.cover.anim-prev{animation:coverPrev .38s ease}
.fab{position:absolute;bottom:-29px;right:24px;width:58px;height:58px;border:0;border-radius:50%;
background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 7px 18px #0007;cursor:pointer}
.info{padding:48px 26px 0;flex:none}
.title-row{display:flex;align-items:center;gap:8px}
.title{font-size:24px;font-weight:750;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.track-heart{color:var(--accent);display:none;align-items:center}
.track-heart.show{display:flex}
.subtitle{font-size:16px;color:var(--muted);margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:30px;display:flex;justify-content:space-between;align-items:center;color:#b9b9c0;font-size:16px;font-weight:650}
.progress-area{padding:22px 20px 0;flex:none;direction:ltr}
input[type=range]{width:100%;height:28px;margin:0;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;
background:linear-gradient(to right,var(--accent) 0 var(--fill,0%),#5a5a5e var(--fill,0%) 100%)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:21px;height:21px;border-radius:50%;
background:var(--accent);margin-top:-8px;box-shadow:0 1px 4px #0008}
.times{display:flex;justify-content:space-between;color:#bbbcc2;font-size:16px;margin-top:7px;padding:0 5px}
.controls{padding:28px 26px 20px;display:flex;align-items:center;justify-content:space-evenly;direction:ltr;flex:none}
.control-btn{width:76px;height:76px;border:0;border-radius:50%;background:transparent;color:#f0f0f2;
font-size:34px;display:grid;place-items:center;cursor:pointer}
.control-btn:active{background:#29292d}
.flex-spacer{flex:1;min-height:6px}
.skip-icon{width:30px;height:30px}
.skip-icon path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.skip-icon polygon{fill:currentColor}
.skip-icon text{fill:currentColor;font-size:8px;font-weight:800}
.play{width:100px;height:100px;border:0;border-radius:50%;background:var(--accent);color:#16241b;
display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 26px rgba(98,201,121,.4)}
.play:active{transform:scale(.94)}
.play svg{width:42px;height:42px;display:block}
.play svg path,.play svg rect{fill:currentColor}
.play .ico-pause{display:none}
.play.playing .ico-play{display:none}
.play.playing .ico-pause{display:inline}
.secondary{height:74px;padding:0 26px;display:flex;justify-content:center;align-items:center;gap:16px;
border-top:1px solid #28282b;background:#19191b;flex:none}
.pill{border:0;background:#2a2a2e;color:#e9e9ec;padding:11px 18px;border-radius:22px;font-size:15px;cursor:pointer}
.pill:active{background:#37373c}
.speed{min-width:66px;text-align:center;font-weight:750}
.file-input{display:none}
.playlist{position:fixed;inset:0;background:#19191c;z-index:10;transform:translateY(100%);
transition:.25s ease;display:flex;flex-direction:column;padding-top:max(34px,env(safe-area-inset-top))}
.playlist.show{transform:translateY(0)}
.grabber{width:40px;height:5px;border-radius:3px;background:#48484d;margin:10px auto 2px;flex:none;touch-action:none}
.sheet-head{height:64px;padding:0 18px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2b2b30;flex:none;touch-action:none}
.pill-sm{border:0;background:#2a2a2e;color:#e9e9ec;padding:9px 14px;border-radius:18px;font-size:13.5px;cursor:pointer;flex:none}
.sheet-title{font-size:20px;font-weight:750;margin-left:8px}.sheet-spacer{flex:1}
.list{overflow:auto;flex:1;padding:8px 10px 24px}
.item{width:100%;border:0;background:transparent;color:#eee;padding:16px 12px;border-radius:14px;text-align:left;
display:flex;align-items:center;gap:12px;cursor:pointer}
.item:active{background:#29292d}.item.active{background:var(--active)}
.item-num{color:var(--accent);min-width:30px;font-weight:750;text-align:center}
.item-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:16px}
.item-heart{color:var(--accent);width:22px;display:flex;align-items:center;justify-content:center}
.item-type{font-size:11px;color:#92929a;min-width:34px;text-align:right}
.item-del{border:0;background:transparent;color:#8f8f97;width:34px;height:34px;
border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.item-del:active{background:#3a3a3f;color:#ff8080}
.folder-row{display:flex;align-items:center;gap:8px;padding:12px 12px 6px;color:#93939a;
font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;cursor:pointer}
.folder-row:active{background:#232326}
.folder-row svg.solid-icon{flex:none;opacity:.85}
.chevron{flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
transition:transform .15s ease;opacity:.75}
.chevron.open{transform:rotate(90deg)}
.folder-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-del{border:0;background:transparent;color:#75757c;width:26px;height:26px;border-radius:50%;
display:grid;place-items:center;cursor:pointer;flex:none}
.folder-del:active{background:#3a3a3f;color:#ff8080}
.empty{color:#888891;text-align:center;padding:45px 20px;line-height:2}
.toast{position:fixed;bottom:98px;left:50%;transform:translate(-50%,30px);opacity:0;background:#303034;
color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:680px){
 .cover-zone{height:27vh;min-height:185px}.info{padding-top:42px}.meta{margin-top:18px}
 .progress-area{padding-top:14px}.controls{padding-top:12px}.control-btn{width:68px;height:68px}
 .play{width:88px;height:88px}.play svg{width:36px;height:36px}
}
</style>
</head>
<body>
<div class="app">
  <div class="status-space"></div>
  <div class="topbar">
    <div class="brand">
      <svg class="brand-icon" width="34" height="34" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1C1C24"/>
            <stop offset="100%" stop-color="#0E0E13"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
        <circle cx="256" cy="256" r="150" fill="none" stroke="#2A2A34" stroke-width="10"/>
        <path d="M 216 176 L 216 336 L 356 256 Z" fill="#00695C" stroke="#00695C" stroke-width="46" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="app-name">Kid Player</div>
    </div>
    <div class="spacer"></div>
    <div class="top-icons">
      <button class="icon-btn" id="favoriteBtn" aria-label="Favorite">
        <svg class="heart-svg" id="favHeart" viewBox="0 0 24 24" width="24" height="24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
    </div>
  </div>

  <main class="main">
    <section class="cover-zone">
      <div class="cover" id="cover">
        <svg class="note-icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <img class="cover-art" id="coverArt" alt="">
      </div>
      <button class="fab" id="quickList" aria-label="Playlist">
        <svg class="line-icon" viewBox="0 0 24 24" width="24" height="24" style="stroke-width:2.4"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
    </section>

    <section class="info">
      <div class="title-row">
        <div class="title" id="title">No podcast selected</div>
        <div class="track-heart" id="trackHeart"><svg class="heart-svg filled" viewBox="0 0 24 24" width="20" height="20"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
      </div>
      <div class="subtitle" id="subtitle">Choose your podcast or voice messages</div>
      <div class="meta">
        <span id="episode">Ready to play</span>
        <span id="counter">0 / 0</span>
      </div>
    </section>

    <section class="progress-area">
      <input id="progress" type="range" min="0" max="1000" value="0">
      <div class="times"><span id="current">00:00</span><span id="duration">00:00</span></div>
    </section>

    <div class="flex-spacer"></div>
    <section class="controls">
      <button class="control-btn" id="prevBtn" title="Previous">
        <svg class="solid-icon" viewBox="0 0 24 24" width="27" height="27"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="control-btn" id="back5" title="Back 5 seconds">
        <svg class="skip-icon" viewBox="0 0 24 24">
          <path d="M12 4 A8 8 0 1 0 20 12"/>
          <polygon points="16.6,9.6 22.4,9.6 19.5,15.2"/>
          <text x="12" y="15" text-anchor="middle">5</text>
        </svg>
      </button>
      <button class="play" id="playBtn" aria-label="Play">
        <svg viewBox="0 0 24 24">
          <path class="ico-play" d="M8 5v14l11-7z"/>
          <g class="ico-pause">
            <rect x="6.5" y="5" width="4" height="14" rx="1.5"/>
            <rect x="13.5" y="5" width="4" height="14" rx="1.5"/>
          </g>
        </svg>
      </button>
      <button class="control-btn" id="forward5" title="Forward 5 seconds">
        <svg class="skip-icon" viewBox="0 0 24 24">
          <path d="M12 4 A8 8 0 1 1 4 12"/>
          <polygon points="7.4,9.6 1.6,9.6 4.5,15.2"/>
          <text x="12" y="15" text-anchor="middle">5</text>
        </svg>
      </button>
      <button class="control-btn" id="nextBtn" title="Next">
        <svg class="solid-icon" viewBox="0 0 24 24" width="27" height="27"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </section>
    <div class="flex-spacer"></div>

    <section class="secondary">
      <button class="pill" id="speedDown">−</button>
      <button class="pill speed" id="speedBtn">1.0×</button>
      <button class="pill" id="speedUp">+</button>
    </section>
  </main>
</div>

<input id="fileInput" class="file-input" type="file" multiple
accept=".mp3,.wav,.m4a,.aac,.ogg,.oga,.opus,.webm,.3gp,.amr,audio/*">
<input id="folderInput" class="file-input" type="file" webkitdirectory multiple>

<div class="playlist" id="playlist">
  <div class="grabber"></div>
  <div class="sheet-head">
    <button class="icon-btn" id="closeList">
      <svg class="line-icon" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-title">Playlist</div>
    <div class="sheet-spacer"></div>
    <button class="icon-btn sm" id="refreshBtn" aria-label="Refresh folders" title="Refresh">
      <svg class="solid-icon" viewBox="0 0 24 24" width="19" height="19"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button class="icon-btn sm" id="addFolder" aria-label="Add folder" title="Add folder">
      <svg class="solid-icon" viewBox="0 0 24 24" width="19" height="19"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 7h-3v3h-2v-3h-3v-2h3V8h2v3h3v2z"/></svg>
    </button>
    <button class="icon-btn sm" id="addMore" aria-label="Add files" title="Add files">
      <svg class="line-icon" viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  const DB_NAME='kid_player_db_v1', STORE='tracks';
  const audio=document.getElementById('audio');
  const fileInput=document.getElementById('fileInput');
  const folderInput=document.getElementById('folderInput');
  const $=id=>document.getElementById(id);
  const els={
    title:$('title'),subtitle:$('subtitle'),counter:$('counter'),episode:$('episode'),
    progress:$('progress'),current:$('current'),duration:$('duration'),
    play:$('playBtn'),speed:$('speedBtn'),playlist:$('playlist'),list:$('list'),
    toast:$('toast'),trackHeart:$('trackHeart'),fav:$('favoriteBtn'),favHeart:$('favHeart'),
    cover:$('cover'),coverArt:$('coverArt')
  };
  let tracks=[],index=-1,speed=1,dragging=false,db=null;
  let collapsedFolders=new Set();
  try{collapsedFolders=new Set(JSON.parse(localStorage.getItem('kid_player_collapsed')||'[]'))}catch(e){}
  function saveCollapsed(){try{localStorage.setItem('kid_player_collapsed',JSON.stringify([...collapsedFolders]))}catch(e){}}
  const HEART_PATH='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
  const heartSVG=size=>`<svg class="heart-svg filled" viewBox="0 0 24 24" width="${size}" height="${size}"><path d="${HEART_PATH}"/></svg>`;

  function openDB(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE))e.target.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});};
      req.onsuccess=e=>{db=e.target.result;resolve(db)};
      req.onerror=()=>reject(req.error);
    });
  }
  function dbAll(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
  function dbPut(obj){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(obj);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
  function dbPutAll(records){
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE,'readwrite');
      const store=tx.objectStore(STORE);
      const ids=new Array(records.length);
      records.forEach((r,idx)=>{const req=store.put(r);req.onsuccess=()=>{ids[idx]=req.result}});
      tx.oncomplete=()=>resolve(ids);
      tx.onerror=()=>reject(tx.error);
    });
  }
  function dbDelete(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
  function dbDeleteAll(ids){
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE,'readwrite');
      const store=tx.objectStore(STORE);
      ids.forEach(id=>store.delete(id));
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
  }

  function fmt(sec){
    if(!isFinite(sec)||sec<0)return'00:00';
    sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
    return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  const shortName=n=>n.replace(/\.[^.]+$/,'')||n;
  const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

  async function extractID3CoverArt(file){
    try{
      const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
      if(head[0]!==0x49||head[1]!==0x44||head[2]!==0x33)return null;
      const verMajor=head[3];
      if(verMajor<3||verMajor>4)return null;
      const flags=head[5];
      const tagSize=((head[6]&0x7f)<<21)|((head[7]&0x7f)<<14)|((head[8]&0x7f)<<7)|(head[9]&0x7f);
      if(tagSize<=0||tagSize>20*1024*1024)return null;
      const data=new Uint8Array(await file.slice(0,10+tagSize).arrayBuffer());
      const end=10+tagSize;
      let pos=10;
      if(flags&0x40){
        const extSize=verMajor===4
          ?((data[pos]&0x7f)<<21)|((data[pos+1]&0x7f)<<14)|((data[pos+2]&0x7f)<<7)|(data[pos+3]&0x7f)
          :(data[pos]<<24)|(data[pos+1]<<16)|(data[pos+2]<<8)|data[pos+3];
        pos+=verMajor===4?extSize:extSize+4;
      }
      while(pos+10<=end){
        const id=String.fromCharCode(data[pos],data[pos+1],data[pos+2],data[pos+3]);
        if(id==='\0\0\0\0')break;
        const frameSize=verMajor===4
          ?((data[pos+4]&0x7f)<<21)|((data[pos+5]&0x7f)<<14)|((data[pos+6]&0x7f)<<7)|(data[pos+7]&0x7f)
          :(data[pos+4]<<24)|(data[pos+5]<<16)|(data[pos+6]<<8)|data[pos+7];
        const frameStart=pos+10;
        if(frameSize<=0||frameStart+frameSize>end)break;
        if(id==='APIC'){
          const fd=data.subarray(frameStart,frameStart+frameSize);
          const enc=fd[0];let p=1,mimeEnd=p;
          while(mimeEnd<fd.length&&fd[mimeEnd]!==0)mimeEnd++;
          const mime=Array.from(fd.subarray(p,mimeEnd)).map(c=>String.fromCharCode(c)).join('')||'image/jpeg';
          p=mimeEnd+1;p+=1;
          if(enc===1||enc===2){while(p+1<fd.length&&!(fd[p]===0&&fd[p+1]===0))p+=2;p+=2}
          else{while(p<fd.length&&fd[p]!==0)p++;p+=1}
          const imgBytes=fd.subarray(p);
          if(imgBytes.length>100)return new Blob([imgBytes],{type:mime});
        }
        pos=frameStart+frameSize;
      }
      return null;
    }catch(e){return null}
  }
  let coverToken=0;
  function applyCoverContent(t){
    if(t&&t.artUrl){
      els.coverArt.src=t.artUrl;els.cover.classList.add('has-art');els.coverArt.classList.add('show');
    }else{
      els.coverArt.classList.remove('show');els.cover.classList.remove('has-art');
    }
  }
  async function ensureArtwork(t){
    if(!t||t.artUrl!==undefined)return;
    t.artUrl=null;
    try{const blob=await extractID3CoverArt(t.blob);if(blob)t.artUrl=URL.createObjectURL(blob)}catch(e){}
  }
  function refreshCover(t,dir){
    const myToken=++coverToken;
    const swap=async()=>{await ensureArtwork(t);if(myToken===coverToken)applyCoverContent(t)};
    if(dir){
      els.cover.classList.remove('anim-next','anim-prev');
      void els.cover.offsetWidth;
      els.cover.classList.add(dir==='prev'?'anim-prev':'anim-next');
      setTimeout(swap,170);
    }else{
      swap();
    }
  }
  function showToast(text){els.toast.textContent=text;els.toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>els.toast.classList.remove('show'),1800)}
  function savePosition(){localStorage.setItem('kid_player_track_id',index>=0&&tracks[index]?String(tracks[index].id):'');localStorage.setItem('kid_player_speed',speed)}
  function updateFavoriteUI(){
    const fav=index>=0&&tracks[index]?.favorite;
    els.trackHeart.classList.toggle('show',!!fav);
    els.favHeart.classList.toggle('filled',!!fav);
    els.fav.style.color=fav?'var(--accent)':'';
  }
  function renderList(){
    if(!tracks.length){els.list.innerHTML='<div class="empty">No files yet.<br>Add podcasts or voice messages.</div>';return}
    const events=[];
    let prevSegs=[];
    tracks.forEach((t,i)=>{
      const segs=t.path?t.path.split('/'):[];
      let common=0;
      while(common<segs.length&&common<prevSegs.length&&segs[common]===prevSegs[common])common++;
      for(let d=common;d<segs.length;d++)events.push({type:'folder',depth:d,name:segs[d],path:segs.slice(0,d+1).join('/')});
      prevSegs=segs;
      events.push({type:'file',depth:segs.length,track:t,index:i});
    });
    let html='',hiddenDepth=null;
    for(const ev of events){
      if(hiddenDepth!==null){
        if(ev.depth>hiddenDepth)continue;
        hiddenDepth=null;
      }
      if(ev.type==='folder'){
        const isCollapsed=collapsedFolders.has(ev.path);
        html+=`<div class="folder-row" data-path="${escapeHtml(ev.path)}" style="padding-left:${12+ev.depth*22}px">
          <svg class="chevron ${isCollapsed?'':'open'}" viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6"/></svg>
          <svg class="solid-icon" viewBox="0 0 24 24" width="15" height="15"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          <span class="folder-name">${escapeHtml(ev.name)}</span>
          <button class="folder-del" data-path="${escapeHtml(ev.path)}" title="Remove folder" aria-label="Remove folder">
            <svg class="line-icon" viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>`;
        if(isCollapsed)hiddenDepth=ev.depth;
      }else{
        const t=ev.track,i=ev.index;
        html+=`<div class="item ${i===index?'active':''}" data-i="${i}" style="padding-left:${12+ev.depth*22}px">
        <button class="item-main" data-i="${i}" style="all:unset;display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer">
          <span class="item-num">${String(i+1).padStart(2,'0')}</span>
          <span class="item-name">${escapeHtml(shortName(t.name))}</span>
          <span class="item-heart">${t.favorite?heartSVG(17):''}</span>
          <span class="item-type">${(t.name.split('.').pop()||'audio').toUpperCase()}</span>
        </button>
        <button class="item-del" data-i="${i}" title="Remove" aria-label="Remove">
          <svg class="line-icon" viewBox="0 0 24 24" width="17" height="17"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>`;
      }
    }
    els.list.innerHTML=html;
    els.list.querySelectorAll('.item-main').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;loadTrack(i,true,i===index?undefined:(i>index?'next':'prev'));hidePlaylist()});
    els.list.querySelectorAll('.item-del').forEach(b=>b.onclick=(e)=>{e.stopPropagation();removeTrack(+b.dataset.i)});
    els.list.querySelectorAll('.folder-row').forEach(row=>{
      row.onclick=(e)=>{
        if(e.target.closest('.folder-del'))return;
        const p=row.dataset.path;
        if(collapsedFolders.has(p))collapsedFolders.delete(p);else collapsedFolders.add(p);
        saveCollapsed();renderList();
      };
    });
    els.list.querySelectorAll('.folder-del').forEach(b=>b.onclick=(e)=>{e.stopPropagation();removeFolder(b.dataset.path)});
  }
  function updateInfo(){
    if(index<0||!tracks[index]){els.title.textContent='No podcast selected';els.subtitle.textContent='Choose your podcast or voice messages';els.counter.textContent='0 / 0';els.episode.textContent='Ready to play';updateFavoriteUI();return}
    const t=tracks[index];
    els.title.textContent=shortName(t.name);els.subtitle.textContent=t.type||(t.name.split('.').pop()||'AUDIO').toUpperCase();
    els.counter.textContent=`${index+1} / ${tracks.length}`;els.episode.textContent='Ready';
    updateFavoriteUI();
  }
  function loadTrack(i,autoplay=false,dir){
    if(i<0||i>=tracks.length)return;
    audio.pause();index=i;
    audio.src=tracks[i].url;
    audio.playbackRate=speed;
    els.progress.value=0;els.progress.style.setProperty('--fill','0%');els.current.textContent='00:00';els.duration.textContent='00:00';els.play.classList.remove('playing');
    updateInfo();renderList();savePosition();
    refreshCover(tracks[i],dir);
    if(autoplay)audio.play().catch(()=>showToast('This file could not start automatically'));
  }
  function sortTracks(){
    const currentId=index>=0?tracks[index]?.id:null;
    tracks.sort((a,b)=>{
      const pa=(a.path||'').toLowerCase(),pb=(b.path||'').toLowerCase();
      if(pa!==pb)return pa<pb?-1:1;
      return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;
    });
    if(currentId!=null)index=tracks.findIndex(t=>t.id===currentId);
  }
  async function addFiles(list,getPath){
    const files=[...list].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|m4a|aac|ogg|oga|opus|webm|3gp|amr)$/i.test(f.name));
    if(!files.length){showToast('No supported audio file found');return}
    try{
      const records=files.map(f=>({name:f.name,type:f.type,blob:f,favorite:false,added:Date.now(),path:getPath?getPath(f):''}));
      const ids=await dbPutAll(records);
      files.forEach((f,idx)=>{
        tracks.push({id:ids[idx],name:f.name,type:f.type,blob:f,url:URL.createObjectURL(f),favorite:false,path:records[idx].path});
      });
      sortTracks();
      if(index===-1)loadTrack(0,false);else{updateInfo();renderList()}
      showToast(`${files.length} file${files.length>1?'s':''} added`);
    }catch(e){showToast('Not enough browser storage to save these files')}
  }
  async function toggleFavorite(){
    if(index<0)return;
    tracks[index].favorite=!tracks[index].favorite;
    try{
      await dbPut({id:tracks[index].id,name:tracks[index].name,type:tracks[index].type,blob:tracks[index].blob,favorite:tracks[index].favorite,added:tracks[index].added||Date.now()});
      updateFavoriteUI();renderList();showToast(tracks[index].favorite?'Added to favorites':'Removed from favorites');
    }catch(e){showToast('Could not save favorite')}
  }
  async function removeTrack(i){
    if(i<0||i>=tracks.length)return;
    const wasCurrent=i===index;
    const removed=tracks[i];
    try{await dbDelete(removed.id)}catch(e){showToast('Could not remove file');return}
    URL.revokeObjectURL(removed.url);
    if(removed.artUrl)URL.revokeObjectURL(removed.artUrl);
    tracks.splice(i,1);
    if(!tracks.length){
      index=-1;audio.pause();audio.removeAttribute('src');audio.load();
      updateInfo();renderList();savePosition();
    }else if(wasCurrent){
      index=Math.min(i,tracks.length-1);
      loadTrack(index,!audio.paused);
    }else{
      if(i<index)index--;
      updateInfo();renderList();savePosition();
    }
    showToast('File removed');
  }
  async function removeFolder(path){
    const idxSet=new Set();
    tracks.forEach((t,i)=>{const p=t.path||'';if(p===path||p.startsWith(path+'/'))idxSet.add(i)});
    if(!idxSet.size)return;
    const removed=[...idxSet].map(i=>tracks[i]);
    const currentId=index>=0?tracks[index]?.id:null;
    const wasCurrentRemoved=currentId!=null&&removed.some(t=>t.id===currentId);
    try{await dbDeleteAll(removed.map(t=>t.id))}catch(e){showToast('Could not remove folder');return}
    removed.forEach(t=>{URL.revokeObjectURL(t.url);if(t.artUrl)URL.revokeObjectURL(t.artUrl)});
    tracks=tracks.filter((t,i)=>!idxSet.has(i));
    collapsedFolders.delete(path);saveCollapsed();
    if(!tracks.length){
      index=-1;audio.pause();audio.removeAttribute('src');audio.load();
      updateInfo();renderList();savePosition();
    }else if(wasCurrentRemoved){
      loadTrack(0,false);
    }else{
      index=tracks.findIndex(t=>t.id===currentId);
      updateInfo();renderList();savePosition();
    }
    showToast(`Folder removed (${removed.length} file${removed.length>1?'s':''})`);
  }
  function seek(s){if(index<0||!isFinite(audio.duration))return;audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+s))}
  function togglePlay(){if(index===-1){fileInput.click();return}audio.paused?audio.play().catch(()=>showToast('This format is not supported by this browser')):audio.pause()}
  function changeSpeed(d){speed=Math.round(Math.min(4,Math.max(.1,speed+d))*10)/10;audio.playbackRate=speed;els.speed.textContent=speed.toFixed(1)+'×';savePosition()}
  function showPlaylist(){
    renderList();els.playlist.classList.add('show');
    try{history.pushState({playlistOpen:true},'')}catch(e){}
  }
  function hidePlaylist(fromPopState){
    els.playlist.classList.remove('show');
    if(!fromPopState){
      try{if(history.state&&history.state.playlistOpen)history.back()}catch(e){}
    }
  }
  window.addEventListener('popstate',()=>{
    if(els.playlist.classList.contains('show'))hidePlaylist(true);
  });

  function folderPathOf(f){
    const rel=f.webkitRelativePath||'';
    const parts=rel.split('/');parts.pop();
    return parts.join('/');
  }
  let folderRefreshMode=false;
  fileInput.addEventListener('change',e=>{addFiles(e.target.files);fileInput.value=''});
  folderInput.addEventListener('change',e=>{
    const rawFiles=[...e.target.files];
    folderInput.value='';
    if(folderRefreshMode){
      const known=new Set(tracks.map(t=>(t.path||'')+'/'+t.name.toLowerCase()));
      const newFiles=rawFiles.filter(f=>!known.has(folderPathOf(f)+'/'+f.name.toLowerCase()));
      if(!newFiles.length){showToast('No new files found');return}
      addFiles(newFiles,folderPathOf);
    }else{
      addFiles(rawFiles,folderPathOf);
    }
  });
  $('addMore').onclick=()=>fileInput.click();
  $('addFolder').onclick=()=>{folderRefreshMode=false;folderInput.click()};
  $('refreshBtn').onclick=()=>{folderRefreshMode=true;folderInput.click()};
  $('quickList').onclick=showPlaylist;$('closeList').onclick=hidePlaylist;
  els.play.onclick=togglePlay;$('back5').onclick=()=>seek(-5);$('forward5').onclick=()=>seek(5);
  $('prevBtn').onclick=()=>{if(index>0)loadTrack(index-1,true,'prev')};
  $('nextBtn').onclick=()=>{if(index<tracks.length-1)loadTrack(index+1,true,'next')};
  $('speedDown').onclick=()=>changeSpeed(-.1);$('speedUp').onclick=()=>changeSpeed(.1);
  els.speed.onclick=()=>{speed=1;audio.playbackRate=1;els.speed.textContent='1.0×';savePosition();showToast('Speed reset to 1.0×')};
  els.fav.onclick=toggleFavorite;

  audio.addEventListener('play',()=>{els.play.classList.add('playing');els.play.setAttribute('aria-label','Pause');els.episode.textContent='Playing'});
  audio.addEventListener('pause',()=>{els.play.classList.remove('playing');els.play.setAttribute('aria-label','Play');if(index>=0&&!audio.ended)els.episode.textContent='Paused'});
  audio.addEventListener('loadedmetadata',()=>els.duration.textContent=fmt(audio.duration));
  audio.addEventListener('timeupdate',()=>{if(dragging||!isFinite(audio.duration)||!audio.duration)return;const v=Math.round(audio.currentTime/audio.duration*1000);els.progress.value=v;els.progress.style.setProperty('--fill',(v/10)+'%');els.current.textContent=fmt(audio.currentTime)});
  audio.addEventListener('ended',()=>{if(index<tracks.length-1)loadTrack(index+1,true,'next');else{els.play.classList.remove('playing');els.episode.textContent='Playlist finished'}});
  audio.addEventListener('error',()=>showToast('This file or codec is not supported'));
  els.progress.addEventListener('pointerdown',()=>dragging=true);
  els.progress.addEventListener('pointerup',()=>{dragging=false;if(isFinite(audio.duration))audio.currentTime=(+els.progress.value/1000)*audio.duration});
  els.progress.addEventListener('pointercancel',()=>dragging=false);
  els.progress.addEventListener('input',()=>{const p=+els.progress.value/10;els.progress.style.setProperty('--fill',p+'%');if(isFinite(audio.duration))els.current.textContent=fmt((+els.progress.value/1000)*audio.duration)});

  // Swipe down on the playlist's grabber/header/list-at-top to dismiss it
  (function(){
    const sheet=els.playlist;
    let startY=0,dy=0,active=false,tracking=false;
    function down(e){
      if(e.target.closest('#closeList')||e.target.closest('#addMore')||e.target.closest('#addFolder')||e.target.closest('#refreshBtn'))return;
      const inHeader=!!e.target.closest('.grabber')||!!e.target.closest('.sheet-head');
      const listAtTop=els.list.scrollTop<=0;
      if(!inHeader&&!listAtTop)return;
      tracking=true;active=false;dy=0;
      startY=e.touches[0].clientY;
    }
    function move(e){
      if(!tracking)return;
      const d=e.touches[0].clientY-startY;
      if(d<=0)return;
      if(!active){
        if(d<10)return;
        active=true;sheet.style.transition='none';
      }
      e.preventDefault();dy=d;
      sheet.style.transform=`translateY(${dy}px)`;
    }
    function up(){
      tracking=false;
      if(active){
        sheet.style.transition='';sheet.style.transform='';
        if(dy>70)hidePlaylist();
      }
      active=false;dy=0;
    }
    sheet.addEventListener('touchstart',down,{passive:true});
    sheet.addEventListener('touchmove',move,{passive:false});
    sheet.addEventListener('touchend',up);
    sheet.addEventListener('touchcancel',up);
  })();

  // Swipe left/right on the album art to skip to next/previous track
  (function(){
    const zone=document.querySelector('.cover-zone');
    let sx=0,sy=0,tracking=false;
    zone.addEventListener('pointerdown',e=>{
      if(e.target.closest('.fab'))return;
      sx=e.clientX;sy=e.clientY;tracking=true;
    });
    zone.addEventListener('pointerup',e=>{
      if(!tracking)return;tracking=false;
      const dx=e.clientX-sx,dy=e.clientY-sy;
      if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.3)return;
      if(dx<0){if(index<tracks.length-1)loadTrack(index+1,true,'next');else showToast('This is the last track')}
      else{if(index>0)loadTrack(index-1,true,'prev');else showToast('This is the first track')}
    });
    zone.addEventListener('pointercancel',()=>tracking=false);
  })();

  async function restore(){
    speed=parseFloat(localStorage.getItem('kid_player_speed')||'1')||1;els.speed.textContent=speed.toFixed(1)+'×';
    try{
      await openDB();const saved=await dbAll();
      tracks=saved.sort((a,b)=>(a.id||0)-(b.id||0)).map(t=>({...t,url:URL.createObjectURL(t.blob)}));
      sortTracks();
      if(tracks.length){
        const savedId=localStorage.getItem('kid_player_track_id');
        let savedIndex=savedId?tracks.findIndex(t=>String(t.id)===savedId):-1;
        if(savedIndex<0)savedIndex=0;
        loadTrack(savedIndex,false);
      }
      else updateInfo();
    }catch(e){showToast('Saved files could not be restored')}
  }
  restore();
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
